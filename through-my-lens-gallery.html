<style>
:root{--bg:#f8f3eb;--ink:#29272a;--wine:#7d4149;--line:#d9c9b6}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{font:15px/1.7 "Segoe UI",Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}

.container{margin:0 auto;max-width:1130px;padding:4px 1px 40px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:27px 21px}

.photo{width:100%;display:block;position:relative;border:1px solid #c7b8a7;background:#e5dacf;padding:0;overflow:hidden}

.photo:hover img,.photo:focus-visible img{transform:scale(1.035);filter:brightness(.94)}
.favorites .photo{aspect-ratio:1.1}
.more .photo{aspect-ratio:1.5}
.zoom{position:absolute;right:10px;bottom:10px;background:rgba(37,39,42,.9);color:white;padding:3px 11px;min-width:38px;min-height:38px;font:23px/32px Georgia,serif}
figcaption{padding:12px 0 0}
figcaption strong{display:block;font:400 24px/1.3 Georgia,serif;color:#3b3234}
figcaption span{display:block;font:13px/1.6 "Segoe UI",Arial,sans-serif;color:#706467;margin-top:3px}
.subsection{border-top:1px solid var(--line);margin:31px 0 23px;padding-top:17px}
.subsection h2{font:400 27px/1.3 Georgia,serif;margin:0 0 7px}
.subsection p{color:#6c6161;font-size:13px;margin:0}
.photo-dialog{border:0;padding:35px 18px 17px;background:#242426;color:#eee7df;width:min(94vw,1120px);max-height:95vh;overflow:auto}
.photo-dialog::backdrop{background:rgba(13,13,15,.93)}
.photo-dialog img{display:block;margin:0 auto;max-width:100%;max-height:75vh;object-fit:contain}
.photo-dialog h3{font:400 22px Georgia,serif;text-align:center;margin:15px 0 4px}
.photo-dialog p{font-size:13px;text-align:center;color:#ded1c9;margin:0}
.close{position:sticky;top:0;float:right;z-index:2;padding:5px 12px;border:1px solid #8b7474;background:#332d30;color:#fff;font-weight:800}
footer{font:italic 15px/1.6 Georgia,serif;color:#79555c;margin:25px 0 0;padding-left:15px;border-left:2px solid #9b6268}
@media(max-width:650px){.grid{grid-template-columns:1fr;gap:20px}.favorites .photo{aspect-ratio:1.5}.more .photo{aspect-ratio:1.55}figcaption strong{font-size:22px}}
@media(prefers-reduced-motion:reduce){.photo img{transition:none}html{scroll-behavior:auto}}

</section>
<div class="subsection"><h2>More moments that caught my eye.</h2><p>Small details, quiet scenes, and places with a little character.</p></div>
<section class="grid more" aria-label="Other photographs">
<figure><button class="photo" type="button" data-image="lake-view" data-title="A quiet moment" data-alt="Calm lake seen from a hillside with a pine tree at the side." data-caption="A view that made me stop for a minute." aria-label="Enlarge photo: A quiet moment"><img alt="Calm lake seen from a hillside with a pine tree at the side." loading="lazy" decoding="async" width="700" height="500"><span class="zoom" aria-hidden="true">↗</span></button><figcaption><strong>A quiet moment</strong><span>A view that made me stop for a minute.</span></figcaption></figure><figure><button class="photo" type="button" data-image="deer" data-title="Well, hello there" data-alt="A curious deer up close through a wire fence." data-caption="Sometimes the moment comes right to you." aria-label="Enlarge photo: Well, hello there"><img alt="A curious deer up close through a wire fence." loading="lazy" decoding="async" width="700" height="500"><span class="zoom" aria-hidden="true">↗</span></button><figcaption><strong>Well, hello there</strong><span>Sometimes the moment comes right to you.</span></figcaption></figure><figure><button class="photo" type="button" data-image="sunflower" data-title="Looking up" data-alt="A sunflower photographed against a bright blue sky." data-caption="A little sunshine in the middle of the day." aria-label="Enlarge photo: Looking up"><img alt="A sunflower photographed against a bright blue sky." loading="lazy" decoding="async" width="700" height="500"><span class="zoom" aria-hidden="true">↗</span></button><figcaption><strong>Looking up</strong><span>A little sunshine in the middle of the day.</span></figcaption></figure><figure><button class="photo" type="button" data-image="old-truck" data-title="Stories in the rust" data-alt="An old rusty truck sitting in a lush green field." data-caption="A few miles behind it. Maybe a few stories, too." aria-label="Enlarge photo: Stories in the rust"><img alt="An old rusty truck sitting in a lush green field." loading="lazy" decoding="async" width="700" height="500"><span class="zoom" aria-hidden="true">↗</span></button><figcaption><strong>Stories in the rust</strong><span>A few miles behind it. Maybe a few stories, too.</span></figcaption></figure>
</section>
<footer>No fancy equipment. Just the camera in my pocket and a reason to stop for a moment.</footer>

// All photographs are embedded in this file; the gallery never contacts Canva.
const dialog = document.querySelector('#viewer');
const expanded = document.querySelector('#expanded');
for (const button of document.querySelectorAll('[data-image]')) {
  const data = 'data:image/webp;base64,' + photos[button.dataset.image];
  const img = button.querySelector('img');
  img.src = data;
  button.addEventListener('click', () => {
    expanded.src = data;
    expanded.alt = button.dataset.alt;
    document.querySelector('#viewer-title').textContent = button.dataset.title;
    document.querySelector('#viewer-caption').textContent = button.dataset.caption;
    dialog.showModal();
  });
}
document.querySelector('#close').addEventListener('click', () => dialog.close());
dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); });
